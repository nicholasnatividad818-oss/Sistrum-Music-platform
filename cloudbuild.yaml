steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
      - --build-arg
      - VITE_SUPABASE_URL=$_SUPABASE_URL
      - --build-arg
      - VITE_SUPABASE_PUBLISHABLE_KEY=$_SUPABASE_PUBLISHABLE_KEY
      - --build-arg
      - VITE_SPOTIFY_CLIENT_ID=$_SPOTIFY_CLIENT_ID
      - --build-arg
      - VITE_SPOTIFY_REDIRECT_URI=$_SPOTIFY_REDIRECT_URI
      - --build-arg
      - VITE_POSTHOG_KEY=$_POSTHOG_KEY
      - --build-arg
      - VITE_POSTHOG_HOST=$_POSTHOG_HOST
      - --build-arg
      - VITE_WALLETCONNECT_PROJECT_ID=$_WALLETCONNECT_PROJECT_ID
      - --build-arg
      - VITE_BTCPAY_RELEASE_ID=$_BTCPAY_RELEASE_ID
      - --build-arg
      - VITE_BTCPAY_CHECKOUT_URL=$_BTCPAY_CHECKOUT_URL
      - --build-arg
      - VITE_BTCPAY_PRICE_LABEL=$_BTCPAY_PRICE_LABEL
      - --build-arg
      - VITE_BTCPAY_SUPPORT_EMAIL=$_BTCPAY_SUPPORT_EMAIL
      - -f
      - Dockerfile
      - .
  - name: node:22-alpine
    entrypoint: node
    args: ['scripts/deploy-review.mjs']
    secretEnv: ['XAI_API_KEY']
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
      - --region=$_DEPLOY_REGION
      - --project=$PROJECT_ID
      - --port=8080
      - --quiet
images:
  - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
substitutions:
  _SUPABASE_URL: ''
  _SUPABASE_PUBLISHABLE_KEY: ''
  _SPOTIFY_CLIENT_ID: ''
  _SPOTIFY_REDIRECT_URI: ''
  _POSTHOG_KEY: ''
  _POSTHOG_HOST: 'https://us.i.posthog.com'
  _WALLETCONNECT_PROJECT_ID: ''
  _BTCPAY_RELEASE_ID: ''
  _BTCPAY_CHECKOUT_URL: ''
  _BTCPAY_PRICE_LABEL: ''
  _BTCPAY_SUPPORT_EMAIL: ''
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/xai-api-key/versions/latest
      env: XAI_API_KEY
options:
  logging: CLOUD_LOGGING_ONLY
