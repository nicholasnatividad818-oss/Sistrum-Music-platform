name: Sistrum release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build production container
        run: docker build -t sistrum-check .
      - name: Verify container routes
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name sistrum-check -p 8080:8080 sistrum-check
          trap 'docker logs sistrum-check; docker rm -f sistrum-check' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/catalog | grep -q '<title>Sistrum</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/profile)" = 404
